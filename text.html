<!DOCTYPE html>
<head>
    <title>Text Elements</title>
    <style>
        .underline{
            text-decoration:underline ;
        }
        .strike{
            text-decoration: line-through;
        }
        .uppercase{
            text-transform: uppercase;
        }
        .capitalize{
            text-transform: capitalize;
        }
    </style>
</head>
<body>
    <p class="underline">teghfvwg</p>
    <p class="strike">hi</p>
    <p class="uppercase">this is uppercase</p>
    <p class="capitalize">hi again</p>

</body>
</html>
