<!DOCTYPE html>
<head>
    <title>Badges</title>

</head>
<body>
    <div class="container mt-3">
        <h3>Messages🔔<span class="badge bg-primary">6</span></h3>
        <h3>E-Mails📧<span class="badge bg-info">3</span></h3>
        <button class="btn btn-danger">
           Pending tasks <span class="badge bg-secondary">8</span>
        </button>
    </div>
</body>
</html>
