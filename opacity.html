<!DOCTYPE html>

<head>
    <title>Opacity</title>
    <style>
        .box{
            background-color: blue;
            width: 200px;
            height: 100px;
            opacity: 0.5;
            
        }
        img{
            opacity: 0.5;
            transition: 0.5s;

        }
        img:hover{
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="box">
        This is opauqe <q>Do you write it like that ?</q> text.
    </div>
    <img src="Mypfp.png" alt="My profile picture">
</body>
</html>
