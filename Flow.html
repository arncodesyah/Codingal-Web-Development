<!DOCTYPE html>
<head>
    <title>Flow in CSS</title>
    <style>
        body{
            background-color: darkgoldenrod;
        }
        div{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            width: 150px;
            height: 150px;

        }
        .b1{
            background-color: cadetblue;
            float: right;
        }
        .b2{
            background-color:crimson ;
            float: left;
        }
        .b3{
            background-color: aquamarine;
            float: right;
        }
    </style>
</head>
<body>
    <div class="b1">This is the first box.</div>
    <div class="b2">This is the second box.</div>
    <div class="b3">This is the third box.</div>
</body>
</html>
