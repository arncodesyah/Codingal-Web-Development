<!DOCTYPE html>
<head>
    <title>Progress Bar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <br>
    <div class="progress">
        <div class="progress-bar bg-danger" style="width: 20%;">20%</div>
    </div>
    <br>
    <div class="progress">
    <div class="progress-bar bg-primary" style="width: 60%;"></div>
    </div>
    <br>
    <div class="progress">
        <div class="progress-bar bg-danger" style="width: 25%;">25%</div>
        <div class="progress-bar bg-warning" style="width: 25%;">50%</div>
        <div class="progress-bar bg-primary" style="width: 25%;">75%</div>
        <div class="progress-bar bg-success" style="width: 25%;">100%</div>
    </div>
</body>
</html>
